[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aitest-mock"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitest_mock"]
