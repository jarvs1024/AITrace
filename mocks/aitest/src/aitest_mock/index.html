<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aitest Mock 控制台（知因链路演示）</title>
<style>
  body { margin: 0; background: #f5f6f8; color: #222; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { background: #1f2937; color: #fff; padding: 14px 20px; }
  header h1 { margin: 0; font-size: 18px; }
  main { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
  .panel { background: #fff; border: 1px solid #e2e5ea; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 15px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .toolbar label { font-size: 13px; }
  input { padding: 6px 8px; border: 1px solid #cbd2d9; border-radius: 6px; font-size: 13px; }
  select { padding: 6px 8px; border: 1px solid #cbd2d9; border-radius: 6px; font-size: 13px; }
  textarea { padding: 6px 8px; border: 1px solid #cbd2d9; border-radius: 6px; font-size: 13px; width: 100%; box-sizing: border-box; font-family: inherit; }
  button { padding: 7px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #6b7280; }
  button.secondary:hover { background: #4b5563; }
  button.good { background: #15803d; }
  button.good:hover { background: #166534; }
  button.bad { background: #b91c1c; }
  button.bad:hover { background: #991b1b; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #e2e5ea; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #f3f4f6; }
  th.sortable { cursor: pointer; user-select: none; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; display: inline-block; }
  .failed { background: #fee2e2; color: #b91c1c; }
  .passed { background: #dcfce7; color: #15803d; }
  .done { background: #dcfce7; color: #15803d; }
  .running { background: #dbeafe; color: #1d4ed8; }
  pre { background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  #errors { background: #7f1d1d; }
  .muted { color: #6b7280; font-size: 12px; margin-top: 10px; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  .card { flex: 1 1 140px; background: #f8fafc; border: 1px solid #e2e5ea; border-radius: 8px; padding: 10px 12px; }
  .card .num { font-size: 22px; font-weight: 600; color: #1f2937; }
  .card .cap { font-size: 12px; color: #6b7280; }
  .dist-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
  .dist-name { width: 200px; text-align: right; color: #374151; }
  .dist-bar { flex: 1; background: #e5e7eb; border-radius: 4px; height: 14px; overflow: hidden; }
  .dist-fill { background: #2563eb; height: 100%; border-radius: 4px; }
  .dist-count { width: 30px; color: #6b7280; }
  .report-card { border: 1px solid #dbeafe; border-radius: 8px; padding: 10px 12px; margin-top: 8px; background: #f8fafc; }
  .report-card h3 { margin: 0 0 8px; font-size: 14px; }
  .k { color: #6b7280; font-size: 12px; }
  .v { font-size: 13px; margin-bottom: 6px; white-space: pre-wrap; word-break: break-all; }
  .detail-trigger { padding: 2px 8px; font-size: 12px; background: #0ea5e9; }
  .detail-trigger:hover { background: #0284c7; }
  .section-title { font-size: 14px; font-weight: 600; margin: 14px 0 8px; color: #1f2937; border-left: 3px solid #2563eb; padding-left: 8px; }
  .feedback-zone { margin-top: 10px; border-top: 1px dashed #e2e5ea; padding-top: 10px; }
  .correction-form { background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 10px; margin-top: 8px; }
  .chip { display: inline-block; padding: 2px 10px; margin: 2px 6px 2px 0; background: #eef2ff; color: #3730a3; border-radius: 10px; font-size: 12px; }
  .chip.warn { background: #fef9c3; color: #854d0e; }
  .chip.bad { background: #fee2e2; color: #b91c1c; }
  .warn-text { color: #b45309; font-size: 12px; margin-top: 6px; }
  .ok-text { color: #15803d; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header><h1>aitest Mock 控制台（推送到知因 · 解析结果反馈 · 运营看板）</h1></header>
<main>
  <section class="panel">
    <h2>用例清单</h2>
    <div class="toolbar">
      <label>读取令牌 <input id="read-token" value="mock-read-token" size="24"></label>
      <label>batch_id <input id="batch-id" value="BATCH-20261120-0089" size="24"></label>
      <button id="load-cases-btn" type="button">加载用例</button>
    </div>
    <div id="cases-panel" class="muted">尚未加载</div>
  </section>
  <section class="panel">
    <h2>推送到知因</h2>
    <div class="toolbar">
      <button id="deliver-btn" type="button">推送到知因</button>
      <button id="refresh-sessions-btn" type="button" class="secondary">刷新会话状态</button>
    </div>
    <div id="deliver-result" class="muted">尚未推送</div>
    <div id="sessions-panel"></div>
    <div id="session-detail"></div>
  </section>
  <section class="panel">
    <h2>运营看板（知因同源呈现 · 只拉不推）</h2>
    <div class="toolbar">
      <label>产品过滤 <input id="product-filter" placeholder="留空=全部产品" size="16"></label>
      <button id="refresh-stats-btn" type="button">刷新看板</button>
    </div>
    <div id="stats-panel" class="muted">尚未加载</div>
  </section>
  <section class="panel">
    <h2>回调记录</h2>
    <button id="refresh-callbacks-btn" type="button">刷新回调</button>
    <div id="callbacks-panel" class="muted">尚未刷新</div>
  </section>
  <section class="panel">
    <h2>错误</h2>
    <pre id="errors">（无）</pre>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const TERMINAL_STAGES = ["COMPLETED", "FAILED"];

const ROOT_CAUSE_LABELS = {
  TEST_ENV_ERROR: "测试环境问题",
  FW_DEFECT: "固件缺陷",
  SCRIPT_ISSUE: "脚本问题",
  HW_DEFECT: "硬件缺陷",
  OTHER: "其他",
};
const FEEDBACK_LABELS = {
  VALID: "结论有效",
  INVALID: "结论无效",
  AWAITING_FEEDBACK: "等待反馈",
  FAILED: "分析失败",
  RUNNING: "分析中",
};
const QUEUE_LABELS = {
  PENDING: "排队中",
  CLEANING: "清洗中",
  READY: "待路由",
  AI_RUNNING: "AI 分析中",
  WAITING: "等待引用",
};
const HISTOGRAM_LABELS = ["0.0-0.3", "0.3-0.5", "0.5-0.7", "0.7-0.9", "0.9-1.0"];

function readToken() {
  return $("read-token").value.trim() || "mock-read-token";
}

function showError(context, status, text) {
  $("errors").textContent = "[" + context + "] HTTP " + status + "\n" + text;
}

function el(tag, text) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  return node;
}

async function api(path, options) {
  const opts = options || {};
  const headers = Object.assign({ "X-Aitest-Read-Token": readToken() }, opts.headers || {});
  if (opts.body) headers["Content-Type"] = "application/json";
  const response = await fetch(path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body,
  });
  const text = await response.text();
  let body = text;
  try { body = JSON.parse(text); } catch (e) { /* 保持原文 */ }
  if (!response.ok) {
    showError(opts.label || path, response.status,
      typeof body === "string" ? body : JSON.stringify(body, null, 2));
    throw new Error("HTTP " + response.status);
  }
  $("errors").textContent = "（无）";
  return body;
}

function renderCases(data) {
  const panel = $("cases-panel");
  panel.textContent = "";
  panel.appendChild(el("div", "batch_id：" + data.batch_id));
  const table = el("table");
  const head = el("tr");
  head.appendChild(el("th", "case_id"));
  head.appendChild(el("th", "状态"));
  const thead = el("thead");
  thead.appendChild(head);
  table.appendChild(thead);
  const tbody = el("tbody");
  for (const item of data.cases || []) {
    const row = el("tr");
    row.appendChild(el("td", item.case_id));
    const cell = el("td");
    const badge = el("span", item.status);
    badge.className = "badge " + (item.status === "FAILED" ? "failed" : "passed");
    cell.appendChild(badge);
    row.appendChild(cell);
    tbody.appendChild(row);
  }
  table.appendChild(tbody);
  panel.appendChild(table);
}

async function loadCases() {
  const batchId = $("batch-id").value.trim() || "BATCH-20261120-0089";
  try {
    renderCases(await api("/api/v1/aitest/cases?batch_id=" + encodeURIComponent(batchId),
      { label: "加载用例" }));
  } catch (e) { /* 错误已展示 */ }
}

/* ---------------- 会话状态与解析结果详情 ---------------- */

function stageBadge(stage) {
  const badge = el("span", stage == null ? "-" : String(stage));
  if (stage === "COMPLETED") badge.className = "badge done";
  else if (stage === "FAILED") badge.className = "badge failed";
  else badge.className = "badge running";
  return badge;
}

function roundStatusBadge(statusText) {
  const badge = el("span", statusText == null ? "-" : String(statusText));
  if (statusText === "VALID" || statusText === "COMPLETED") badge.className = "badge done";
  else if (statusText === "INVALID" || statusText === "FAILED") badge.className = "badge failed";
  else badge.className = "badge running";
  return badge;
}

function appendField(card, key, value) {
  if (value === null || value === undefined || value === "" ||
      (Array.isArray(value) && value.length === 0)) return;
  const row = el("div");
  row.appendChild(el("div", key)).className = "k";
  const v = el("div");
  v.className = "v";
  if (typeof value === "string") v.textContent = value;
  else if (Array.isArray(value) && value.every((x) => typeof x === "string")) {
    v.textContent = value.join("\n");
  } else {
    v.textContent = JSON.stringify(value, null, 2);
  }
  row.appendChild(v);
  card.appendChild(row);
}

function renderCitation(card, citation) {
  if (!citation || !citation.citing_status || citation.citing_status === "NONE") return;
  const row = el("div");
  row.appendChild(el("div", "引用状态")).className = "k";
  const stale = citation.citing_status === "CITING_STALE";
  const badge = el("span", stale ? "CITING_STALE（引用已失效）" : "CITING（引用生效）");
  badge.className = "badge " + (stale ? "failed" : "done");
  row.appendChild(badge);
  const desc = el("div",
    "引用同批案例 " + (citation.source_session || "-") + " 结论（版本 " + citation.cited_version + "）");
  desc.className = "v";
  row.appendChild(desc);
  card.appendChild(row);
}

function renderRounds(card, rounds) {
  if (!rounds || rounds.length === 0) return;
  card.appendChild(el("div", "历史轮次（重诊追加，全保留）")).className = "k";
  const table = el("table");
  const head = el("tr");
  ["轮次", "阶段", "反馈状态", "置信度", "报告编号"].forEach((n) => head.appendChild(el("th", n)));
  const thead = el("thead");
  thead.appendChild(head);
  table.appendChild(thead);
  const tbody = el("tbody");
  for (const r of rounds) {
    const row = el("tr");
    row.appendChild(el("td", "第 " + r.round_no + " 轮"));
    const st = el("td");
    st.appendChild(stageBadge(r.stage));
    row.appendChild(st);
    const rs = el("td");
    rs.appendChild(roundStatusBadge(r.round_status));
    row.appendChild(rs);
    row.appendChild(el("td", r.confidence == null ? "-" : String(r.confidence)));
    row.appendChild(el("td", r.report_id || "-"));
    tbody.appendChild(row);
  }
  table.appendChild(tbody);
  card.appendChild(table);
}

let detailSessionId = null;

function renderReportDetail(session, status) {
  detailSessionId = session.session_id;
  const panel = $("session-detail");
  panel.textContent = "";
  const card = el("div");
  card.className = "report-card";
  card.appendChild(el("h3", "解析结果详情：" + (session.session_id || "-")));
  appendField(card, "用例 / 产品", (status.case_id || "-") + " / " + (status.product_id || "-"));
  appendField(card, "硬件 / 领域画像",
    (status.hardware_type || "-") + " / " + (status.domain_id || "-") + "（" + (status.profile_version || "-") + "）");
  appendField(card, "当前轮次", "第 " + status.round_no + " 轮");
  if (status.report) {
    const result = status.report.result || {};
    const rc = result.root_cause || {};
    appendField(card, "报告编号", status.report.report_id || "-");
    appendField(card, "根因类别", rc.category
      ? rc.category + (ROOT_CAUSE_LABELS[rc.category] ? "（" + ROOT_CAUSE_LABELS[rc.category] + "）" : "")
      : "-");
    appendField(card, "根因详情", rc.detail || "-");
    appendField(card, "证据链", rc.evidence);
    appendField(card, "置信度", result.confidence);
    appendField(card, "修复建议", result.solution || "-");
    appendField(card, "缺口说明", result.gap_note || "-");
    appendField(card, "日志证据链", status.referenced_logs);
    appendField(card, "处理步骤", status.process_steps);
  } else {
    card.appendChild(el("div", "（尚未生成报告；当前 stage=" + (status.stage || "-") + "）"));
  }
  renderCitation(card, status.citation);
  renderRounds(card, status.rounds);
  renderFeedbackZone(card, session, status);
  panel.appendChild(card);
}

function refreshDetail(session) {
  return api("/api/v1/aitest/aitrace/status/" + encodeURIComponent(session.session_id),
    { label: "会话状态查询" }).then((status) => {
    sessionCache.set(session.session_id, status);
    renderReportDetail(session, status);
    return status;
  });
}

function pollDetailUntilTerminal(session) {
  if (detailSessionId !== session.session_id) return;
  setTimeout(() => {
    if (detailSessionId !== session.session_id) return;
    refreshDetail(session).then((status) => {
      if (detailSessionId !== session.session_id) return;
      if (TERMINAL_STAGES.indexOf(status.stage) === -1) pollDetailUntilTerminal(session);
    }).catch(() => {
      if (detailSessionId === session.session_id) pollDetailUntilTerminal(session);
    });
  }, 2000);
}

/* ---------------- 两态反馈与重诊（spec FR6 / FR9） ---------------- */

function renderFeedbackZone(card, session, status) {
  const zone = el("div");
  zone.className = "feedback-zone";
  const terminal = TERMINAL_STAGES.indexOf(status.stage) !== -1;

  if (status.grant_feedback) {
    zone.appendChild(el("div", "结果反馈（有效/无效）")).className = "k";
    const toolbar = el("div");
    toolbar.className = "toolbar";
    const reviewerLabel = el("label", "复核人 ");
    const reviewerInput = el("input");
    reviewerInput.id = "reviewer-input";
    reviewerInput.value = "zhangsan";
    reviewerInput.size = 12;
    reviewerLabel.appendChild(reviewerInput);
    toolbar.appendChild(reviewerLabel);
    const validBtn = el("button", "结论有效");
    validBtn.className = "good";
    validBtn.type = "button";
    validBtn.addEventListener("click", () => submitFeedback(session, status, "VALID", null, zone));
    const invalidBtn = el("button", "结论无效");
    invalidBtn.className = "bad";
    invalidBtn.type = "button";
    invalidBtn.addEventListener("click", () => toggleCorrectionForm(zone, session, status));
    toolbar.appendChild(validBtn);
    toolbar.appendChild(invalidBtn);
    zone.appendChild(toolbar);
    zone.appendChild(el("div", "")).id = "feedback-result";
  }

  if (terminal) {
    const reToolbar = el("div");
    reToolbar.className = "toolbar";
    const hintInput = el("input");
    hintInput.id = "rediagnose-hint";
    hintInput.placeholder = "重诊提示（选填，如补充日志说明）";
    hintInput.size = 28;
    const reBtn = el("button", "发起重诊");
    reBtn.className = "secondary";
    reBtn.type = "button";
    reBtn.addEventListener("click", () => submitRediagnose(session, hintInput));
    reToolbar.appendChild(hintInput);
    reToolbar.appendChild(reBtn);
    zone.appendChild(reToolbar);
  }

  if (zone.childNodes.length > 0) card.appendChild(zone);
}

function toggleCorrectionForm(zone, session, status) {
  const existing = zone.querySelector(".correction-form");
  if (existing) {
    existing.remove();
    return;
  }
  const form = el("div");
  form.className = "correction-form";
  const catLabel = el("div", "正确根因分类（选填；选择后必须填写修正说明）");
  catLabel.className = "k";
  form.appendChild(catLabel);
  const select = el("select");
  select.id = "correction-category";
  const noneOpt = el("option", "不提供修正（仅标记无效）");
  noneOpt.value = "";
  select.appendChild(noneOpt);
  for (const key of Object.keys(ROOT_CAUSE_LABELS)) {
    const opt = el("option", key + "（" + ROOT_CAUSE_LABELS[key] + "）");
    opt.value = key;
    select.appendChild(opt);
  }
  form.appendChild(select);
  const reasonArea = document.createElement("textarea");
  reasonArea.id = "correction-reason";
  reasonArea.rows = 2;
  reasonArea.placeholder = "修正说明（选填）";
  form.appendChild(reasonArea);
  form.appendChild(el("div", "")).id = "correction-warn";
  const formToolbar = el("div");
  formToolbar.className = "toolbar";
  const submitBtn = el("button", "提交无效反馈");
  submitBtn.className = "bad";
  submitBtn.type = "button";
  submitBtn.addEventListener("click", () => {
    const category = select.value;
    const reason = reasonArea.value.trim();
    const warn = form.querySelector("#correction-warn");
    if (category && !reason) {
      warn.textContent = "选择修正分类时必须填写修正说明";
      warn.className = "warn-text";
      return;
    }
    if (!category && reason) {
      warn.textContent = "填写修正说明时请同时选择正确根因分类，否则说明不会被保存";
      warn.className = "warn-text";
      return;
    }
    const correction = category
      ? { root_cause_category: category, reason: reason } : null;
    submitFeedback(session, status, "INVALID", correction, zone).then((done) => {
      if (done) form.remove();
    });
  });
  const cancelBtn = el("button", "取消");
  cancelBtn.className = "secondary";
  cancelBtn.type = "button";
  cancelBtn.addEventListener("click", () => form.remove());
  formToolbar.appendChild(submitBtn);
  formToolbar.appendChild(cancelBtn);
  form.appendChild(formToolbar);
  zone.appendChild(form);
}

async function submitFeedback(session, status, action, correction, zone) {
  const reviewerInput = $("reviewer-input");
  const body = {
    session_id: session.session_id,
    batch_id: status.batch_id,
    case_id: status.case_id || "",
    reviewer: (reviewerInput && reviewerInput.value.trim()) || "zhangsan",
    action: action,
  };
  if (correction) body.correction = correction;
  try {
    const data = await api("/api/v1/aitest/aitrace/feedback",
      { method: "POST", body: JSON.stringify(body), label: "提交反馈" });
    const message = "反馈已提交：feedback_id=" + data.feedback_id + "，版本 " + data.version
      + "，状态 " + (data.status === "applied" ? "已生效" : "重复提交（幂等）");
    refreshDashboard().catch(() => {});
    await refreshDetail(session);
    const newCard = $("session-detail").querySelector(".report-card");
    if (newCard) {
      const line = el("div", message);
      line.className = "ok-text";
      newCard.appendChild(line);
    }
    return data;
  } catch (e) {
    return null;
  }
}

async function submitRediagnose(session, hintInput) {
  const reviewerInput = $("reviewer-input");
  const body = {
    trigger_user_id: (reviewerInput && reviewerInput.value.trim()) || "zhangsan",
    hint: hintInput.value.trim() || null,
  };
  try {
    const data = await api(
      "/api/v1/aitest/aitrace/sessions/" + encodeURIComponent(session.session_id) + "/rediagnose",
      { method: "POST", body: JSON.stringify(body), label: "发起重诊" });
    refreshDashboard().catch(() => {});
    await refreshDetail(session);
    pollDetailUntilTerminal(session);
    return data;
  } catch (e) {
    return null;
  }
}

const sessionCache = new Map();

function pollSession(session, cells) {
  const sessionId = session.session_id;
  return api("/api/v1/aitest/aitrace/status/" + encodeURIComponent(sessionId),
    { label: "会话状态查询" }).then((status) => {
    sessionCache.set(sessionId, status);
    cells.stage.textContent = "";
    cells.stage.appendChild(stageBadge(status.stage));
    cells.progress.textContent = status.progress == null ? "-" : String(status.progress);
    cells.reason.textContent = status.waiting_reason || "-";
    cells.message.textContent = status.message || "-";
    return status;
  }).catch((e) => { return null; });
}

function renderSessions(data) {
  const panel = $("sessions-panel");
  panel.textContent = "";
  $("session-detail").textContent = "";
  detailSessionId = null;
  sessionCache.clear();
  const sessions = data.sessions || [];
  if (sessions.length === 0) {
    panel.appendChild(el("div", "（无会话）"));
    return;
  }
  const table = el("table");
  const head = el("tr");
  ["case_id", "session_id", "status", "stage", "progress", "waiting_reason", "message", "操作"]
    .forEach((name) => head.appendChild(el("th", name)));
  const thead = el("thead");
  thead.appendChild(head);
  table.appendChild(thead);
  const tbody = el("tbody");
  table.appendChild(tbody);
  panel.appendChild(table);
  for (const session of sessions) {
    const row = el("tr");
    row.appendChild(el("td", String(session.case_id || "-")));
    row.appendChild(el("td", String(session.session_id || "-")));
    row.appendChild(el("td", String(session.status || "-")));
    const cells = { stage: el("td", "-"), progress: el("td", "-"), reason: el("td", "-"), message: el("td", "-") };
    row.appendChild(cells.stage);
    row.appendChild(cells.progress);
    row.appendChild(cells.reason);
    row.appendChild(cells.message);
    const opCell = el("td");
    const btn = el("button", "解析结果");
    btn.className = "detail-trigger";
    btn.type = "button";
    btn.addEventListener("click", () => {
      const cached = sessionCache.get(session.session_id);
      if (cached) {
        renderReportDetail(session, cached);
      } else {
        pollSession(session, cells).then((status) => {
          if (status) renderReportDetail(session, status);
        });
      }
    });
    opCell.appendChild(btn);
    row.appendChild(opCell);
    tbody.appendChild(row);
    (function pollUntilTerminal() {
      pollSession(session, cells).then((status) => {
        if (status && TERMINAL_STAGES.indexOf(status.stage) !== -1) {
          if (detailSessionId === null || detailSessionId === session.session_id) {
            renderReportDetail(session, status);
          }
          return;
        }
        setTimeout(pollUntilTerminal, 2000);
      }).catch(() => {
        setTimeout(pollUntilTerminal, 2000);
      });
    })();
  }
  const rejected = data.rejected || [];
  if (rejected.length > 0) {
    panel.appendChild(el("div", "被拒绝用例："));
    const pre = el("pre");
    pre.textContent = JSON.stringify(rejected, null, 2);
    panel.appendChild(pre);
  }
}

async function deliver() {
  try {
    const data = await api("/api/v1/aitest/deliver", { method: "POST", label: "推送到知因" });
    const panel = $("deliver-result");
    panel.textContent = "";
    panel.appendChild(el("div", "batch_task_id：" + (data.batch_task_id || "-")));
    renderSessions(data);
    refreshDashboard().catch(() => {});
  } catch (e) { /* 错误已展示 */ }
}

/* ---------------- 运营看板（六大视图，spec FR7） ---------------- */

let dashboardCache = null;
let localStatsCache = null;
let productSort = { key: null, dir: 1 };

function pct(value) {
  return value == null ? "-" : Math.round(value * 100) + "%";
}

function num2(value) {
  return value == null ? "-" : Number(value).toFixed(2);
}

function card(num, cap) {
  const c = el("div");
  c.className = "card";
  const n = el("div", num === null || num === undefined ? "-" : String(num));
  n.className = "num";
  c.appendChild(n);
  const t = el("div", cap);
  t.className = "cap";
  c.appendChild(t);
  return c;
}

function distRow(name, count, total) {
  const row = el("div");
  row.className = "dist-row";
  const nm = el("span", name);
  nm.className = "dist-name";
  row.appendChild(nm);
  const bar = el("div");
  bar.className = "dist-bar";
  const fill = el("div");
  fill.className = "dist-fill";
  fill.style.width = total > 0 ? Math.round((count / total) * 100) + "%" : "0%";
  bar.appendChild(fill);
  row.appendChild(bar);
  const ct = el("span", String(count));
  ct.className = "dist-count";
  row.appendChild(ct);
  return row;
}

function sectionTitle(panel, text) {
  const t = el("div", text);
  t.className = "section-title";
  panel.appendChild(t);
}

function barBlock(panel, title, entries) {
  const total = entries.reduce((a, b) => a + b[1], 0);
  if (total <= 0) return;
  const wrap = el("div");
  wrap.appendChild(el("div", title)).className = "k";
  for (const entry of entries) wrap.appendChild(distRow(entry[0], entry[1], total));
  panel.appendChild(wrap);
}

const PRODUCT_COLUMNS = [
  ["product_id", "产品"],
  ["session_count", "诊断记录数"],
  ["round_count", "诊断次数"],
  ["valid", "有效"],
  ["invalid", "无效"],
  ["awaiting", "等待反馈"],
  ["failed", "分析失败"],
  ["running", "分析中"],
  ["valid_rate", "有效诊断率"],
];

function renderByProduct(panel, rows) {
  if (rows.length === 0) {
    panel.appendChild(el("div", "（暂无诊断记录）")).className = "muted";
    return;
  }
  const sorted = rows.slice();
  if (productSort.key) {
    const key = productSort.key;
    sorted.sort((a, b) => {
      const va = a[key];
      const vb = b[key];
      if (typeof va === "string" || typeof vb === "string") {
        return String(va).localeCompare(String(vb)) * productSort.dir;
      }
      return ((va || 0) - (vb || 0)) * productSort.dir;
    });
  }
  const table = el("table");
  const head = el("tr");
  for (const col of PRODUCT_COLUMNS) {
    const th = el("th", col[1] + (productSort.key === col[0] ? (productSort.dir === 1 ? " ▲" : " ▼") : ""));
    th.className = "sortable";
    th.addEventListener("click", () => {
      if (productSort.key === col[0]) productSort.dir = -productSort.dir;
      else { productSort.key = col[0]; productSort.dir = 1; }
      if (dashboardCache) renderDashboard(dashboardCache, localStatsCache);
    });
    head.appendChild(th);
  }
  const thead = el("thead");
  thead.appendChild(head);
  table.appendChild(thead);
  const tbody = el("tbody");
  for (const p of sorted) {
    const row = el("tr");
    for (const col of PRODUCT_COLUMNS) {
      const value = p[col[0]];
      row.appendChild(el("td", col[0] === "valid_rate" ? pct(value) : String(value == null ? "-" : value)));
    }
    tbody.appendChild(row);
  }
  table.appendChild(tbody);
  panel.appendChild(table);
}

function renderMonitorChips(panel, data) {
  const rt = data.runtime || {};
  const chips = el("div");
  for (const key of Object.keys(QUEUE_LABELS)) {
    const chip = el("span", QUEUE_LABELS[key] + "：" + ((rt.queue_counts || {})[key] || 0));
    chip.className = "chip";
    chips.appendChild(chip);
  }
  const pausedChip = el("span", "暂停用户：" + (rt.paused_users || 0));
  pausedChip.className = "chip" + ((rt.paused_users || 0) > 0 ? " warn" : "");
  chips.appendChild(pausedChip);
  const monitoring = data.monitoring || {};
  const audit = monitoring.audit || {};
  if (audit.verified === false) {
    const chip = el("span", "审计校验：失败");
    chip.className = "chip bad";
    chips.appendChild(chip);
  } else {
    const chip = el("span", "审计校验：" + (audit.verified === true ? "通过" : "-"));
    chip.className = "chip";
    chips.appendChild(chip);
  }
  const wm = monitoring.watermark || {};
  const wmChip = el("span", "存储水位：" + (wm.level || "-")
    + (wm.fraction != null ? "（" + Math.round(wm.fraction * 100) + "%）" : ""));
  wmChip.className = "chip" + (wm.level === "FORCE" ? " bad" : wm.level === "WARN" ? " warn" : "");
  chips.appendChild(wmChip);
  const workers = monitoring.workers || {};
  const workerChip = el("span", "AI 并发：" + (workers.ai_running || 0) + "/" + (workers.width_w || "-"));
  workerChip.className = "chip";
  chips.appendChild(workerChip);
  panel.appendChild(chips);
}

function renderDashboard(data, local) {
  const panel = $("stats-panel");
  panel.textContent = "";
  const ov = data.overview || {};

  sectionTitle(panel, "① 效能总览");
  const overviewCards = el("div");
  overviewCards.className = "cards";
  overviewCards.appendChild(card(ov.session_count, "诊断总数"));
  overviewCards.appendChild(card(ov.round_count, "诊断次数"));
  overviewCards.appendChild(card(pct(ov.valid_rate), "有效诊断率"));
  panel.appendChild(overviewCards);
  const rd = ov.round_distribution || {};
  barBlock(panel, "诊断次数分布", [["1 轮", rd["1"] || 0], ["2 轮", rd["2"] || 0], ["3 轮+", rd["3+"] || 0]]);
  const fb = ov.feedback_distribution || {};
  barBlock(panel, "反馈状态分布", Object.keys(FEEDBACK_LABELS)
    .map((k) => [FEEDBACK_LABELS[k] + "（" + k + "）", fb[k] || 0]));

  sectionTitle(panel, "② 按产品汇总");
  renderByProduct(panel, data.by_product || []);

  sectionTitle(panel, "③ 根因大盘");
  const rc = data.root_cause_distribution || {};
  barBlock(panel, "根因分布", Object.keys(ROOT_CAUSE_LABELS)
    .map((k) => [ROOT_CAUSE_LABELS[k] + "（" + k + "）", rc[k] || 0]));

  const know = data.knowledge || {};
  sectionTitle(panel, "④ 有效率与知识资产");
  const assetCards = el("div");
  assetCards.className = "cards";
  assetCards.appendChild(card(pct(ov.valid_rate), "有效诊断率"));
  assetCards.appendChild(card(know.case_count, "案例库案例数"));
  assetCards.appendChild(card(pct(know.hot_memory_hit_rate), "热记忆命中率"));
  panel.appendChild(assetCards);

  sectionTitle(panel, "⑤ 实时监控台");
  renderMonitorChips(panel, data);

  sectionTitle(panel, "⑥ 置信度质量");
  const confCards = el("div");
  confCards.className = "cards";
  confCards.appendChild(card(num2(know.avg_confidence), "平均置信度"));
  confCards.appendChild(card(pct(know.low_confidence_ratio), "低置信占比（<0.5）"));
  panel.appendChild(confCards);
  const hist = data.confidence_histogram || {};
  barBlock(panel, "置信度直方图", HISTOGRAM_LABELS.map((k) => [k, hist[k] || 0]));

  sectionTitle(panel, "Mock 本地统计（投递/回调）");
  if (!local) {
    panel.appendChild(el("div", "（Mock 本地统计不可用）")).className = "muted";
    return;
  }
  const localCards = el("div");
  localCards.className = "cards";
  localCards.appendChild(card(local.delivery_count, "累计投递"));
  panel.appendChild(localCards);
  const ev = local.event_distribution || {};
  const evNames = Object.keys(ev);
  if (evNames.length > 0) {
    const evLine = el("div", "回调事件：" + evNames.map((n) => n + "×" + ev[n]).join("，"));
    evLine.className = "muted";
    panel.appendChild(evLine);
  }
  const recent = local.recent_deliveries || [];
  if (recent.length > 0) {
    panel.appendChild(el("div", "最近投递")).className = "k";
    const table = el("table");
    const head = el("tr");
    ["时间", "batch_id", "触发用户", "失败用例", "会话"].forEach((n) => head.appendChild(el("th", n)));
    const thead = el("thead");
    thead.appendChild(head);
    table.appendChild(thead);
    const tbody = el("tbody");
    for (const d of recent) {
      const row = el("tr");
      row.appendChild(el("td", (d.at || "-").replace("T", " ").slice(0, 19)));
      row.appendChild(el("td", d.batch_id || "-"));
      row.appendChild(el("td", d.trigger_user_id || "-"));
      row.appendChild(el("td", (d.failed_case_ids || []).join("、") || "-"));
      row.appendChild(el("td", (d.session_ids || []).join("、") || "-"));
      tbody.appendChild(row);
    }
    table.appendChild(tbody);
    panel.appendChild(table);
  }
}

async function refreshDashboard() {
  const pid = $("product-filter").value.trim();
  const url = "/api/v1/aitest/aitrace/dashboard" + (pid ? "?product_id=" + encodeURIComponent(pid) : "");
  try {
    const results = await Promise.all([
      api(url, { label: "运营看板" }),
      api("/__mock/stats", { label: "Mock 本地统计" }).catch(() => null),
    ]);
    dashboardCache = results[0];
    localStatsCache = results[1];
    renderDashboard(results[0], results[1]);
  } catch (e) { /* 错误已展示 */ }
}

async function refreshCallbacks() {
  try {
    const data = await api("/__mock/callbacks", { label: "刷新回调" });
    const panel = $("callbacks-panel");
    panel.textContent = "";
    const items = data.items || [];
    if (items.length === 0) {
      panel.appendChild(el("div", "（暂无回调）"));
      return;
    }
    for (const item of items) {
      const pre = el("pre");
      pre.textContent = JSON.stringify(item, null, 2);
      panel.appendChild(pre);
    }
  } catch (e) { /* 错误已展示 */ }
}

$("load-cases-btn").addEventListener("click", loadCases);
$("deliver-btn").addEventListener("click", deliver);
$("refresh-callbacks-btn").addEventListener("click", refreshCallbacks);
$("refresh-stats-btn").addEventListener("click", refreshDashboard);
$("refresh-sessions-btn").addEventListener("click", () => {
  const ids = Array.from(sessionCache.keys());
  if (ids.length === 0) {
    $("session-detail").textContent = "";
    $("session-detail").appendChild(el("div", "（请先推送到知因）"));
    return;
  }
  // 逐个重查状态并更新缓存；若无表格引用则仅更新缓存与详情
  Promise.all(ids.map((id) => api("/api/v1/aitest/aitrace/status/" + encodeURIComponent(id), { label: "刷新会话状态" })
    .then((s) => { sessionCache.set(id, s); return s; }).catch(() => null)))
    .then((results) => {
      const done = results.filter((s) => s && TERMINAL_STAGES.indexOf(s.stage) !== -1);
      if (done.length > 0 && (detailSessionId === null || detailSessionId === done[0].session_id)) {
        renderReportDetail({ session_id: done[0].session_id }, done[0]);
      }
      refreshDashboard().catch(() => {});
      refreshCallbacks().catch(() => {});
    });
});
loadCases();
refreshDashboard();
</script>
