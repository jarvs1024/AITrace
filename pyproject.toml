[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aitrace"
version = "0.1.0"
description = "AITrace failure analysis sidecar"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0.35,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pyyaml>=6.0,<7",
  "qodercn-agent-sdk>=1.0.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0",
  "jsonschema>=4.20,<5",
]

[project.scripts]
aitrace-server = "aitrace.main:run"
aitrace-backup = "aitrace.ops.backup:console_main"

[tool.hatch.build.targets.wheel]
packages = ["src/aitrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires TEST_DATABASE_URL",
  "e2e: full local chain",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "mocks/aitest/src"]
# 设计文档中的示例代码块不参与格式化检查（ruff>=0.14 会格式化 Markdown 代码块）
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 面向用户的中文诊断信息使用全角标点（，：；（）），按中文排版规范保留
allowed-confusables = ["，", "：", "；", "（", "）"]

[tool.ruff.lint.per-file-ignores]
# Alembic 自动生成的迁移文件行宽不受手工排版约束
"src/aitrace/persistence/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["src/aitrace"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true
