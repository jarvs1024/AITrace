name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aitrace
          POSTGRES_PASSWORD: aitrace
          POSTGRES_DB: aitrace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aitrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aitrace:aitrace@127.0.0.1:5432/aitrace_test
      AITRACE_SERVICE_TOKEN: ci-service-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" -e mocks/aitest
      - run: make lint
      - run: make test
      - run: make contract
      - run: make e2e
      - run: make test-security
      - run: make ops
