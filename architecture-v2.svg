<svg viewBox="0 0 1420 850" width="1420" height="850" xmlns="http://www.w3.org/2000/svg"
     font-family="'Outfit','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2b7cd3"/>
    </marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d94a3d"/>
    </marker>
    <marker id="bd" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5b8fd6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1420" height="850" fill="#ffffff"/>
  <text x="710" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#1a4b8c">独立 AI 测试失败分析与漏斗筛选系统 · 宏观架构</text>

  <!-- ============ 平台侧 ============ -->
  <rect x="24" y="90" width="232" height="626" rx="14" fill="#e9f1fb" stroke="#b9d4f0" stroke-width="1.5"/>
  <text x="140" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16324f">现有自动化测试平台</text>
  <text x="140" y="142" text-anchor="middle" font-size="12.5" fill="#5b7794">（外部对接）</text>

  <rect x="40" y="176" width="200" height="72" rx="9" fill="#ffffff" stroke="#d3e4f7"/>
  <text x="140" y="216" text-anchor="middle" font-size="12.8" font-weight="600" fill="#16324f">自动化调度</text>

  <rect x="40" y="264" width="200" height="72" rx="9" fill="#ffffff" stroke="#d3e4f7"/>
  <text x="140" y="294" text-anchor="middle" font-size="12.8" font-weight="600" fill="#16324f">测试日志 / 串口日志</text>
  <text x="140" y="313" text-anchor="middle" font-size="10.5" fill="#7b8fa5">用例输出 · 内核 · 设备日志</text>

  <rect x="40" y="352" width="200" height="72" rx="9" fill="#ffffff" stroke="#d3e4f7"/>
  <text x="140" y="382" text-anchor="middle" font-size="12.8" font-weight="600" fill="#16324f">测试环境信息</text>
  <text x="140" y="401" text-anchor="middle" font-size="10.5" fill="#7b8fa5">SSD / 内存 / CXL 硬件</text>

  <rect x="40" y="440" width="200" height="72" rx="9" fill="#ffffff" stroke="#5b8fd6" stroke-dasharray="5 3"/>
  <circle cx="222" cy="456" r="4" fill="#2b7cd3"/>
  <text x="140" y="470" text-anchor="middle" font-size="12.8" font-weight="600" fill="#16324f">同批次并发执行清单</text>
  <text x="140" y="489" text-anchor="middle" font-size="10.5" fill="#2b7cd3">对照归因的数据基础</text>

  <rect x="40" y="528" width="200" height="72" rx="9" fill="#ffffff" stroke="#5b8fd6" stroke-dasharray="5 3"/>
  <circle cx="222" cy="544" r="4" fill="#2b7cd3"/>
  <text x="140" y="558" text-anchor="middle" font-size="12.8" font-weight="600" fill="#16324f">拓扑快照</text>
  <text x="140" y="577" text-anchor="middle" font-size="10.5" fill="#2b7cd3">主机↔HBA↔背板↔温区</text>

  <rect x="40" y="624" width="200" height="76" rx="9" fill="#fff8e6" stroke="#e3b95a"/>
  <text x="140" y="645" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6414">关键前提</text>
  <text x="140" y="664" text-anchor="middle" font-size="10.4" fill="#8a6414">平台需暴露拓扑与批次标识</text>
  <text x="140" y="680" text-anchor="middle" font-size="10.4" fill="#8a6414">否则环境误报无法剥离</text>

  <!-- ============ 系统外壳 ============ -->
  <rect x="296" y="90" width="1100" height="710" rx="16" fill="#ffffff" stroke="#2b7cd3" stroke-width="2"/>
  <rect x="296" y="90" width="1100" height="42" rx="16" fill="#dceafa"/>
  <rect x="296" y="116" width="1100" height="16" fill="#dceafa"/>
  <text x="846" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#1a4b8c">独立 AI 失败分析系统</text>

  <!-- ============ 阶段 1 ============ -->
  <rect x="316" y="160" width="300" height="448" rx="12" fill="#f7fbff" stroke="#d3e4f7"/>
  <text x="466" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#2b7cd3" letter-spacing="1">阶段 1</text>
  <text x="466" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">多级数据清洗与漏斗筛选</text>

  <polygon points="340,226 592,226 558,270 374,270" fill="#5cc3be"/>
  <text x="466" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">一级初筛</text>
  <polygon points="374,272 558,272 532,312 400,312" fill="#86d5dc"/>
  <text x="466" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#0e4b52">二 / 三级精筛</text>
  <polygon points="400,314 532,314 516,344 416,344" fill="#a8e0e5"/>
  <text x="466" y="334" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0e4b52">指纹去重</text>

  <circle cx="340" cy="366" r="2.6" fill="#8fa3b8"/>
  <text x="350" y="370" font-size="10.6" fill="#3a4a5c">一级：本地规则 + 大面积环境异常拦截</text>
  <circle cx="340" cy="386" r="2.6" fill="#8fa3b8"/>
  <text x="350" y="390" font-size="10.6" fill="#3a4a5c">二 / 三级：疑难故障切片，压缩上下文</text>
  <circle cx="340" cy="406" r="2.6" fill="#8fa3b8"/>
  <text x="350" y="410" font-size="10.6" fill="#3a4a5c">指纹：同类失败合并为一条通知</text>

  <rect x="332" y="430" width="268" height="54" rx="9" fill="#fdecea" stroke="#d94a3d"/>
  <circle cx="352" cy="450" r="6" fill="#d94a3d"/>
  <text x="352" y="453" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">!</text>
  <text x="366" y="455" font-size="12.2" font-weight="700" fill="#b3372c">截流直通知（免 AI 分析）</text>
  <text x="366" y="472" font-size="10.4" fill="#a8625a">环境类异常直接触达，不消耗 AI 算力</text>

  <rect x="332" y="498" width="268" height="56" rx="9" fill="#ffffff" stroke="#c9dcf3" stroke-dasharray="5 3"/>
  <text x="348" y="518" font-size="11.8" font-weight="600" fill="#16324f">入口：失败事件 + 拓扑 + 环境</text>
  <text x="348" y="535" font-size="10.4" fill="#7b8fa5">统一时间基线对齐 · 批次分组</text>
  <text x="348" y="549" font-size="10.4" fill="#7b8fa5">多源证据统一为可溯源条目</text>

  <!-- ============ 阶段 2 ============ -->
  <rect x="656" y="160" width="380" height="448" rx="12" fill="#f7fbff" stroke="#d3e4f7"/>
  <text x="846" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#2b7cd3" letter-spacing="1">阶段 2</text>
  <text x="846" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">AI 深度诊断引擎</text>

  <rect x="672" y="224" width="348" height="70" rx="10" fill="#2b7cd3"/>
  <text x="846" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">AI 深度诊断引擎（Qoder）</text>
  <text x="846" y="272" text-anchor="middle" font-size="10.6" fill="#d5e6f9">多源证据链推理 · 置信度校准 · 知识库复用</text>

  <rect x="672" y="306" width="168" height="66" rx="9" fill="#ffffff" stroke="#d3e4f7"/>
  <text x="686" y="326" font-size="12" font-weight="700" fill="#16324f">SSH 实时探查</text>
  <text x="686" y="343" font-size="10.2" fill="#7b8fa5">盘状态 / 内存 / 硬件</text>
  <text x="686" y="359" font-size="10.2" fill="#c2703c">仅失败后 · 只读 · 超时熔断</text>

  <rect x="852" y="306" width="168" height="66" rx="9" fill="#ffffff" stroke="#d3e4f7"/>
  <text x="866" y="326" font-size="12" font-weight="700" fill="#16324f">综合日志关联分析</text>
  <text x="866" y="343" font-size="10.2" fill="#7b8fa5">跨源事件时间线</text>
  <text x="866" y="359" font-size="10.2" fill="#7b8fa5">定位首个不可恢复事件</text>

  <rect x="672" y="384" width="168" height="66" rx="9" fill="#ffffff" stroke="#5b8fd6" stroke-dasharray="5 3"/>
  <circle cx="826" cy="400" r="4" fill="#2b7cd3"/>
  <text x="686" y="404" font-size="12" font-weight="700" fill="#16324f">同批次对照归因</text>
  <text x="686" y="421" font-size="10.2" fill="#7b8fa5">DUT 缺陷 vs 环境误报</text>
  <text x="686" y="437" font-size="10.2" fill="#7b8fa5">统计显著性与反事实对照</text>

  <rect x="852" y="384" width="168" height="66" rx="9" fill="#ffffff" stroke="#d3e4f7"/>
  <text x="866" y="404" font-size="12" font-weight="700" fill="#16324f">责任域分级</text>
  <text x="866" y="421" font-size="10.2" fill="#7b8fa5">环境 → 主机 → 框架 → 协议</text>
  <text x="866" y="437" font-size="10.2" fill="#7b8fa5">固件 → 器件 → 设计裕量</text>

  <rect x="672" y="462" width="348" height="54" rx="9" fill="#ffffff" stroke="#5b8fd6" stroke-dasharray="5 3"/>
  <circle cx="1006" cy="478" r="4" fill="#2b7cd3"/>
  <text x="686" y="484" font-size="12" font-weight="700" fill="#16324f">复现配方生成 + 影子执行</text>
  <text x="686" y="502" font-size="10.2" fill="#7b8fa5">把 AI 断言升级为机器可验证的确证</text>

  <rect x="672" y="528" width="348" height="52" rx="9" fill="#eaf3fd" stroke="#b9d4f0"/>
  <text x="686" y="549" font-size="11.8" font-weight="700" fill="#16324f">输出</text>
  <text x="686" y="566" font-size="10.4" fill="#4a6076">根因 + 证据链 + 置信度 + 复现配方</text>

  <!-- ============ 阶段 3 ============ -->
  <rect x="1076" y="160" width="300" height="448" rx="12" fill="#f7fbff" stroke="#d3e4f7"/>
  <text x="1226" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#2b7cd3" letter-spacing="1">阶段 3</text>
  <text x="1226" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">结果分类与群通知闭环</text>

  <rect x="1092" y="226" width="268" height="54" rx="9" fill="#ffffff" stroke="#d3e4f7"/>
  <text x="1108" y="246" font-size="12" font-weight="700" fill="#16324f">失败原因分类</text>
  <text x="1108" y="264" font-size="10.4" fill="#7b8fa5">按责任域与故障机理归类</text>

  <rect x="1092" y="290" width="268" height="54" rx="9" fill="#ffffff" stroke="#d3e4f7"/>
  <text x="1108" y="310" font-size="12" font-weight="700" fill="#16324f">置信度分级 P0–P3</text>
  <text x="1108" y="328" font-size="10.4" fill="#7b8fa5">分级路由 · 降噪聚合 · 复发抑制</text>

  <rect x="1092" y="354" width="268" height="54" rx="9" fill="#ffffff" stroke="#d3e4f7"/>
  <text x="1108" y="374" font-size="12" font-weight="700" fill="#16324f">测试群消息推送</text>
  <text x="1108" y="392" font-size="10.4" fill="#7b8fa5">钉钉卡片，结论内可直接操作</text>

  <rect x="1092" y="418" width="268" height="58" rx="9" fill="#ffffff" stroke="#5b8fd6" stroke-dasharray="5 3"/>
  <circle cx="1344" cy="434" r="4" fill="#2b7cd3"/>
  <text x="1108" y="440" font-size="12" font-weight="700" fill="#16324f">人工反馈采集</text>
  <text x="1108" y="458" font-size="10.4" fill="#7b8fa5">采纳 / 纠正 / 驳回 → 训练信号</text>
  <text x="1108" y="472" font-size="10.4" fill="#2b7cd3">闭环进化的唯一燃料</text>

  <rect x="1092" y="486" width="268" height="54" rx="9" fill="#ffffff" stroke="#d3e4f7"/>
  <text x="1108" y="506" font-size="12" font-weight="700" fill="#16324f">失效模式卡归档</text>
  <text x="1108" y="524" font-size="10.4" fill="#7b8fa5">确认结论才可入资产库</text>

  <!-- ============ 知识资产库 ============ -->
  <rect x="316" y="648" width="1040" height="118" rx="12" fill="#f2f8ff" stroke="#2b7cd3" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="836" y="674" text-anchor="middle" font-size="14" font-weight="700" fill="#1a4b8c">知识资产库 · 自进化中枢</text>

  <rect x="336" y="686" width="188" height="64" rx="9" fill="#ffffff" stroke="#c9dcf3"/>
  <text x="352" y="708" font-size="11.8" font-weight="700" fill="#16324f">一级初筛规则库</text>
  <text x="352" y="726" font-size="10" fill="#7b8fa5">确认结论蒸馏而成</text>
  <text x="352" y="740" font-size="10" fill="#7b8fa5">零 AI 快路径</text>

  <rect x="539" y="686" width="188" height="64" rx="9" fill="#ffffff" stroke="#c9dcf3"/>
  <text x="555" y="708" font-size="11.8" font-weight="700" fill="#16324f">失效模式卡</text>
  <text x="555" y="726" font-size="10" fill="#7b8fa5">症状指纹 · 确认根因</text>
  <text x="555" y="740" font-size="10" fill="#7b8fa5">处置手册</text>

  <rect x="742" y="686" width="188" height="64" rx="9" fill="#ffffff" stroke="#c9dcf3"/>
  <text x="758" y="708" font-size="11.8" font-weight="700" fill="#16324f">复现配方库</text>
  <text x="758" y="726" font-size="10" fill="#7b8fa5">结构化可执行剧本</text>
  <text x="758" y="740" font-size="10" fill="#7b8fa5">影子真机可复跑</text>

  <rect x="945" y="686" width="188" height="64" rx="9" fill="#ffffff" stroke="#c9dcf3"/>
  <text x="961" y="708" font-size="11.8" font-weight="700" fill="#16324f">因果先验图</text>
  <text x="961" y="726" font-size="10" fill="#7b8fa5">级联边 · 非缺陷超时边</text>
  <text x="961" y="740" font-size="10" fill="#7b8fa5">增量维护</text>

  <rect x="1148" y="686" width="188" height="64" rx="9" fill="#ffffff" stroke="#c9dcf3"/>
  <text x="1164" y="708" font-size="11.8" font-weight="700" fill="#16324f">反馈训练信号</text>
  <text x="1164" y="726" font-size="10" fill="#7b8fa5">reward → 策略择优</text>
  <text x="1164" y="740" font-size="10" fill="#7b8fa5">→ 规则与用例更新</text>

  <!-- ============ 主流程箭头 ============ -->
  <line x1="256" y1="330" x2="314" y2="330" stroke="#2b7cd3" stroke-width="2" marker-end="url(#b)"/>
  <text x="286" y="300" text-anchor="middle" font-size="10.4" fill="#2b7cd3">标准 API</text>
  <text x="286" y="313" text-anchor="middle" font-size="10.4" fill="#2b7cd3">推送 / 拉取</text>

  <line x1="616" y1="404" x2="654" y2="404" stroke="#2b7cd3" stroke-width="2" marker-end="url(#b)"/>
  <line x1="1036" y1="404" x2="1074" y2="404" stroke="#2b7cd3" stroke-width="2" marker-end="url(#b)"/>

  <!-- 截流旁路 -->
  <path d="M 332 457 L 322 457 L 322 626 L 1240 626 L 1240 610" fill="none" stroke="#d94a3d"
        stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="853" y="620" text-anchor="middle" font-size="10.4" fill="#d94a3d">免 AI 直达通知（环境类异常）</text>

  <!-- 规则反哺（向上） -->
  <line x1="360" y1="648" x2="360" y2="610" stroke="#5b8fd6" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#bd)"/>
  <text x="368" y="634" font-size="10.4" fill="#2b7cd3">规则反哺</text>

  <!-- 经验归档（向下） -->
  <line x1="1262" y1="608" x2="1262" y2="646" stroke="#5b8fd6" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#bd)"/>
  <text x="1270" y="632" font-size="10.4" fill="#2b7cd3">经验归档</text>

  <!-- ============ 图例 ============ -->
  <text x="24" y="822" font-size="10.6" fill="#8a95a5">虚线框 / 蓝点 = 本系统新增或强化的能力　·　红点 = 免 AI 截流路径　·　实线蓝箭头 = 主数据流</text>
</svg>
