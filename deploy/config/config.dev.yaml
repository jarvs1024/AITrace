env: dev
server:
  host: 127.0.0.1
  port: 8080
  log_level: DEBUG
database:
  dsn: postgresql+psycopg://aitrace:aitrace@127.0.0.1:5432/aitrace
  pool_size: 5
queue:
  cleaning_concurrency: 2
  ai_worker_concurrency: 2
storage:
  data_dir: data
  profile_domains_dir: deploy/config/domains
# probe 段可选：缺省时使用内置全局只读白名单（参见 src/aitrace/probe/whitelist.py）。
# 如需收紧直接列出正则列表；空列表 = 拒绝一切探针命令。
